[project]
name = "Clam"
track = "inbox-and-calendar"
tagline = "An unattended inbox agent that reports every change, approval and verified action with a rollback receipt."
license = "MIT"
version = "2.1.0"
primary_provider = "gemini"
primary_model = "gemini-3.1-flash-lite"
entry_command = "make sandbox"

[setup]
mode = "llm-with-offline-smoke"
requires_user_credentials = false
quickstart = "make sandbox"
autonomous_demo = "pnpm agent run"
trap_pack = "pnpm run-official-trap-pack"
adversarial_regression = "pnpm test:adversarial"
tests = "pnpm test"

[safety]
guardrails = "code-enforced"
fail_closed = true
raw_live_email_retention = false
kill_switch = ["ui-latch", "cli-api", "local-lockfile", "auto-trip-circuit-breaker"]
traces_dir = "traces"
trap_pack_report = "tests/official_trap_pack_report.md"
adversarial_report = "tests/adversarial_regression_report.md"
